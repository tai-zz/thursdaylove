name: Publicar no GitHub Pages

on:
  push:
    branches: ["claude/vibrant-clarke-5dxfvi"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages (liga o Pages se ainda estiver desligado)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar o site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          cp -r assets _site/assets
          touch _site/.nojekyll
          ls -R _site

      - name: Enviar os arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
